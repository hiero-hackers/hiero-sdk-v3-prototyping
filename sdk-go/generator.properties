# Configuration of the Go generator (metalang generate --language=go --config=sdk-go/generator.properties).
# See tooling/metalang/README.md and guidelines/api-best-practices-go.md.

# The module path of the generated module. A Go module path is a repository URL, which the specs cannot know.
go.module = github.com/hiero-ledger/hiero-sdk-go

# The minimum Go version: 1.27 for iter.Seq2 (streaming) and generic methods on concrete types.
go.version = 1.27
