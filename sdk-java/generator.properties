# Configuration of the Java generator (tooling/metalang), passed with
#   java -jar tooling/metalang/target/metalang-0.1.0-SNAPSHOT-cli.jar generate --language=java \
#       --config=sdk-java/generator.properties --output=... spec
#
# The specs are language-neutral; this file holds the Java-specific decisions they cannot express.
# All keys start with "java.". Unknown keys and unknown type names are reported as errors.

# --------------------------------------------------------------------------------------------------
# Maven coordinates of the generated project (sdk-java/generated): the parent "hiero-sdk" and one
# sub-module "hiero-<spec folder>" per Java module share this groupId and version.
# --------------------------------------------------------------------------------------------------
java.groupId = org.hiero.sdk
java.version = 0.1.0-SNAPSHOT

# --------------------------------------------------------------------------------------------------
# java.interfaces
#
# Abstractions that are generated as Java interfaces although they have attributes.
#
# By default an abstraction with attributes becomes an abstract class (it stores its attributes and
# implements accessors and setters once). It stays an interface if an enum or an interface extends it,
# or if a type extends it together with another class - Java has no multiple inheritance of classes,
# so in that case NONE of the involved abstractions becomes a class.
#
# List an abstraction here to make it an interface explicitly. For a type that extends two
# abstractions with attributes, listing one of them keeps the other one an abstract class.
#
# Format: qualified names (namespace.Type), separated by commas or whitespace; a backslash at the
# end of a line continues the list, e.g.
#   java.interfaces = consensusnode.client.Submittable, \
#                     ledger.BaseAddress
# --------------------------------------------------------------------------------------------------
java.interfaces =

# --------------------------------------------------------------------------------------------------
# java.protobuf
#
# Spec folders whose module needs the protobuf messages of the Hiero node types. Such a module gets a
# dependency on `hiero-sdk-protobuf` (the hand-written module sdk-java/protobuf, which compiles the
# vendored definitions in /protobuf) and a plain `requires org.hiero.sdk.protobuf` in its
# module-info.java.
#
# Deliberately NOT `requires transitive`: the wire format is an implementation detail, not API. The
# protobuf module exports its packages only to the modules listed here, so the generated classes are
# invisible to anything else on the module path. See protobuf/README.md, "Language bindings".
#
# Format: spec folder names, separated by commas or whitespace.
# --------------------------------------------------------------------------------------------------
java.protobuf = consensus-node-client
