schema: spec-driven

context: |
  This OpenSpec root plans the Java SDK only.
  Java targets Java 21 and uses Maven, JPMS, JSpecify, JUnit, and AssertJ.
  Language-neutral feature proposals and specifications live under ../../openspec-common-delta-changes/changes/ as plain Markdown.
  Each Java change must identify the common feature and source revision from which it was derived.
  Java artifacts may add language mappings but must not silently change common behavior or constraints.

rules:
  proposal:
    - Identify the common feature proposal and specification used as the source.
    - State Java-specific impact and explicitly list behavior intentionally deferred.
  specs:
    - Preserve the common behavioral requirements and add only Java-specific contract mappings.
  design:
    - Keep public API and implementation modules separate and prevent implementation types from leaking.
    - Apply Java 21, JPMS, JSpecify, immutability, and defensive-copying conventions.
  tasks:
    - Include API-shape, consumer-compilation, structural validation, module-boundary, and traceability verification.

operations:
  apply:
    guidance:
      - Implement only the common feature named by the change and its required Java build support.
      - Do not import unrelated code from an earlier aggregate implementation branch.
