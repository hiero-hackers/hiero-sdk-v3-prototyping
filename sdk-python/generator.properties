# Configuration of the Python generator (metalang generate --language=python --config=sdk-python/generator.properties).
# See tooling/metalang/README.md and guidelines/api-best-practices-python.md.

# The distribution name on PyPI. The Hiero namespace guidelines make the `hiero-` prefix mandatory, because PyPI has
# no namespaces (https://github.com/hiero-ledger/governance/blob/main/rules-and-guidelines/namespaces.md).
python.distribution = hiero-sdk

# The import package: `from hiero_sdk.ledger import AccountId`.
python.package = hiero_sdk

# The version of the distribution (PEP 440).
python.version = 0.1.0
