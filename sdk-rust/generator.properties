# Configuration of the Rust generator (metalang generate --language=rust, see tooling/metalang/README.md).
#
# rust.cratePrefix: prefix of the crate names; the crate of the spec folder `base` is `<prefix>-base`.
# rust.version:     version of all crates.
rust.cratePrefix = hiero
rust.version = 0.1.0

# rust.protobuf:     spec folders whose crate compiles the protobuf messages in its build.rs. The crate then gets
#                    prost + a build script, and lib.rs declares `mod proto;` WITHOUT `pub` - the wire format is an
#                    implementation detail, not API (see protobuf/README.md, "Language bindings").
# rust.protobufRoot: the vendored definitions, relative to a crate directory.
rust.protobuf = consensus-node-client
rust.protobufRoot = ../../../../tooling/protobuf/consensus-node
