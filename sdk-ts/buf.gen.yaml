# Generates the TypeScript protobuf code of the SDK from the vendored definitions in /protobuf.
#
# The output is build output, not source: it is written into the consuming package under
# src/internal/proto and is ignored by git. It is deliberately absent from the "exports" map of that
# package's package.json, which is what makes it unreachable from outside the package — the
# TypeScript equivalent of the qualified "exports ... to ..." in Java and of a non-pub module in Rust.
#
# Run through: npm run gen:proto-ts
#
# Paths in this file (out:) are relative to the directory buf is invoked from, which is the
# workspace root `sdk-ts/` (npm runs the script there), which is also this file's directory.
version: v2
managed:
  enabled: true
plugins:
  - local: protoc-gen-es
    out: generated/packages/consensus-node-client/src/internal/proto
    opt:
      - target=ts
      - import_extension=.js
