# Configuration of the TypeScript generator (metalang generate --language=ts --config=sdk-ts/generator.properties).
# See tooling/metalang/README.md and guidelines/api-best-practices-ts.md.

# The npm scope of the packages: one package per spec folder, e.g. @hiero/base, @hiero/consensus-node-client.
ts.scope = @hiero

# The version of all packages.
ts.version = 0.1.0-SNAPSHOT

# The directory of the hand-written support package (@hiero/support: Duration, StreamItem, ...), relative to the
# generated workspace. The workspace links it (npm workspaces) and builds it first (tsconfig references).
ts.support = ../../sdk-ts/support
