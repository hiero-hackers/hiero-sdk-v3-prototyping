schema: spec-driven

context: |
  This OpenSpec root plans the TypeScript SDK only.
  Language-neutral feature proposals and specifications live under ../../openspec-common-delta-changes/changes/ as plain Markdown.
  Each TypeScript change must identify the common feature and source revision from which it was derived.
  TypeScript artifacts may add language mappings but must not silently change common behavior or constraints.

rules:
  proposal:
    - Identify the common feature proposal and specification used as the source.
    - State TypeScript-specific impact and explicitly list behavior intentionally deferred.
  specs:
    - Preserve the common behavioral requirements and add only TypeScript-specific contract mappings.
  design:
    - Keep exported contracts separate from implementation details.
  tasks:
    - Include public-type, consumer-compilation, immutability, asynchronous-contract, and traceability verification.

operations:
  apply:
    guidance:
      - Implement only the common feature named by the change and its required TypeScript build support.
